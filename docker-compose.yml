services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: EmployeeDB
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Server=database;Port=3306;Database=EmployeeDB;User=root;Password=rootpassword;
    depends_on:
      - database
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
